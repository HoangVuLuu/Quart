name: Bug
description: Something does not work as the spec says it should.
labels: ['type:bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
      description: Cite the spec ID if there is one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: where
    attributes:
      label: Where
      placeholder: staging / production / local, device and browser
