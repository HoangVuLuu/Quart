version: 2
updates:
  # Minor and patch updates arrive grouped in one weekly pull request per ecosystem.
  # Major versions arrive one at a time so each gets its own review (see docs/decisions/0007).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /src/web
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
