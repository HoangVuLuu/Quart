<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the layout use the full iPhone screen; safe-area insets keep content clear of the notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E9EEFD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121523" media="(prefers-color-scheme: dark)" />
    <!-- Installed from the home screen (NFR-012): the manifest for Android and desktop, these tags for iPhone,
         which reads neither the manifest's icons nor its display mode. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Quart" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Phone numbers are never links here: the app shows none (12.2), and times like 10:00-16:00 are not numbers to call. -->
    <meta name="format-detection" content="telephone=no" />
    <title>Quart</title>
  </head>
  <body>
    <!-- The launch screen (2026-11-25): drawn before any script runs, replaced by the app. Same as LaunchScreen.tsx. -->
    <div id="root">
      <div class="flex min-h-dvh items-center justify-center bg-bg">
        <div class="quart-blob flex h-28 w-32 items-center justify-center">
          <span class="font-display text-3xl text-white">Quart</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
