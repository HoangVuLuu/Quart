name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # GitHub sets CI=true, so warnings fail the build here (Directory.Build.props).
      - run: dotnet restore Quart.slnx
      - run: dotnet build Quart.slnx --configuration Release --no-restore
      # The build rewrites the OpenAPI document. A difference means an endpoint changed without it.
      - name: OpenAPI document is up to date
        run: git diff --exit-code src/web/openapi || (echo "::error::src/web/openapi/quart.json is stale. Build the API and commit it, then run 'npm run api:generate' in src/web." && exit 1)
      # Database tests start Postgres with Testcontainers. Docker Hub limits anonymous pulls per address
      # and GitHub's runners share addresses, so pulls fail at random ("toomanyrequests"). Google's
      # Docker Hub mirror serves the same official images without that limit; this prefixes every
      # Docker Hub image Testcontainers pulls (postgres, ryuk). Local runs still use Docker Hub.
      - run: dotnet test Quart.slnx --configuration Release --no-build
        env:
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - name: TypeScript client matches the OpenAPI document
        run: |
          npm run api:generate
          if ! git diff --exit-code src/lib/api/schema.d.ts; then
            echo "::error::src/lib/api/schema.d.ts is stale. Run 'npm run api:generate' in src/web and commit it."
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build
      - run: npm run csp:check

  container:
    name: Container image
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Checks the image builds. Deploy staging (deploy-staging.yml) builds, pushes and deploys it after CI passes on main.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
