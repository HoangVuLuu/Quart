name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # GitHub sets CI=true, so warnings fail the build here (Directory.Build.props).
      - run: dotnet restore Quart.slnx
      - run: dotnet build Quart.slnx --configuration Release --no-restore
      # A package with a published security advisory fails the build, whoever's change it is: update it
      # (or the package that pulls it in) before anything else merges.
      - name: No NuGet package with a known vulnerability
        run: |
          dotnet list Quart.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
      # The build rewrites the OpenAPI document. A difference means an endpoint changed without it.
      - name: OpenAPI document is up to date
        run: git diff --exit-code src/web/openapi || (echo "::error::src/web/openapi/quart.json is stale. Build the API and commit it, then run 'npm run api:generate' in src/web." && exit 1)
      # Database tests start Postgres with Testcontainers. Docker Hub limits anonymous pulls per address
      # and GitHub's runners share addresses, so pulls fail at random ("toomanyrequests"). Google's
      # Docker Hub mirror serves the same official images without that limit; this prefixes every
      # Docker Hub image Testcontainers pulls (postgres, ryuk). Local runs still use Docker Hub.
      - run: dotnet test Quart.slnx --configuration Release --no-build --filter "Category!=Performance"
        env:
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io
      # The performance budget (NFR-004, M1-08), alone on the runner so no other test slows it down.
      # The timings show in this step's log and on the run's summary page.
      - name: Generator performance budget
        run: dotnet test tests/Quart.Generator.Tests --configuration Release --no-build --filter "Category=Performance" --logger "console;verbosity=detailed"

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      # Only what ships to browsers. Build tools are kept current by Dependabot.
      - name: No shipped npm package with a known high-severity vulnerability
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript client matches the OpenAPI document
        run: |
          npm run api:generate
          if ! git diff --exit-code src/lib/api/schema.d.ts; then
            echo "::error::src/lib/api/schema.d.ts is stale. Run 'npm run api:generate' in src/web and commit it."
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build
      - run: npm run csp:check

  e2e:
    # The core loop in a real browser, Chromium and WebKit at phone size (M6-09, tests/e2e). No secrets:
    # the API runs in Development against its own Postgres and Mailpit, and never calls outside services.
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Through mirrors, not Docker Hub, for the same reason as the jobs above.
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_DB: quart
          POSTGRES_USER: quart
          POSTGRES_PASSWORD: quart_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quart -d quart" --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: ghcr.io/axllent/mailpit:latest
        ports:
          - 8025:8025
          - 1025:1025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            src/web/package-lock.json
            tests/e2e/package-lock.json
      - run: dotnet build src/backend/Quart.Api --configuration Release
      - name: Build the web app
        working-directory: src/web
        run: |
          npm ci
          npm run build
      - run: npm ci
        working-directory: tests/e2e
      - name: Install Chromium and WebKit
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
        working-directory: tests/e2e
      # The trace replays every step with the page as it was: npx playwright show-trace <trace.zip>.
      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: |
            tests/e2e/test-results
            tests/e2e/playwright-report
          retention-days: 7

  container:
    name: Container image
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Docker Hub limits anonymous pulls per address and GitHub's runners share addresses, so a pull of
      # node:22-alpine can fail with "429 Too Many Requests". Pull Docker Hub images through Google's
      # mirror of the same official images instead; the Dockerfile itself still names Docker Hub.
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      # Checks the image builds. Deploy staging (deploy-staging.yml) builds, pushes and deploys it after CI passes on main.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
